services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fund-prediction-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/database:/app/database
      - ./backend/saved_models:/app/saved_models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fund-prediction-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
